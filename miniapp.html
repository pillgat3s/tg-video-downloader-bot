<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Select Start Position</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent:  var(--tg-theme-button-color, #2ea6ff);
      --accent-t:var(--tg-theme-button-text-color, #fff);
      --bg:      var(--tg-theme-bg-color, #1c1c1e);
      --text:    var(--tg-theme-text-color, #ffffff);
      --hint:    var(--tg-theme-hint-color, #8e8e93);
      --sec-bg:  var(--tg-theme-secondary-bg-color, #2c2c2e);
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 32px;
      gap: 24px;
      -webkit-tap-highlight-color: transparent;
    }
    .header { text-align: center; }
    .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .header p  { font-size: 14px; color: var(--hint); line-height: 1.4; }

    .time-big {
      font-size: 54px; font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px; line-height: 1;
    }

    .waveform-wrap {
      width: 100%; max-width: 420px;
      user-select: none; -webkit-user-select: none;
    }
    canvas#waveform { width: 100%; height: 80px; display: block; border-radius: 8px; touch-action: none; }
    .wave-loading {
      height: 80px; display: flex; align-items: center; justify-content: center;
      color: var(--hint); font-size: 13px; background: var(--sec-bg); border-radius: 8px;
    }

    .times {
      display: flex; justify-content: space-between;
      font-size: 12px; color: var(--hint); font-variant-numeric: tabular-nums;
      width: 100%; max-width: 420px; margin-top: -16px;
    }

    .fine-wrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 6px; }
    .fine-label { text-align: center; font-size: 12px; color: var(--hint); }
    input[type="range"]#fine-seek {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 6px; border-radius: 3px; outline: none; cursor: pointer;
      background: linear-gradient(to right,
        var(--sec-bg) 0%, var(--sec-bg) calc(50% - 1px),
        var(--accent) calc(50% - 1px), var(--accent) calc(50% + 1px),
        var(--sec-bg) calc(50% + 1px), var(--sec-bg) 100%);
    }
    input[type="range"]#fine-seek::-webkit-slider-thumb {
      -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%;
      background: var(--accent); cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.35);
    }
    input[type="range"]#fine-seek::-moz-range-thumb {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--accent); cursor: pointer; border: none;
    }
    .fine-ends {
      display: flex; justify-content: space-between;
      font-size: 11px; color: var(--hint); font-variant-numeric: tabular-nums;
    }

    .play-btn {
      width: 64px; height: 64px; border-radius: 50%; border: none;
      background: var(--accent); color: var(--accent-t);
      font-size: 22px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .15s;
    }
    .play-btn:active { opacity: .7; }

    .confirm-btn {
      width: 100%; max-width: 420px; padding: 16px; border: none;
      border-radius: 14px; background: var(--accent); color: var(--accent-t);
      font-size: 17px; font-weight: 700; cursor: pointer; transition: opacity .15s;
    }
    .confirm-btn:active { opacity: .75; }
    .confirm-btn:disabled { opacity: .5; cursor: default; }

    .status { font-size: 13px; color: var(--hint); text-align: center; min-height: 18px; }
    .status.error { color: #ff453a; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Select Start Position</h1>
    <p>Drag the waveform to navigate.<br>Use the fine slider for sub-second precision.</p>
  </div>

  <div class="time-big" id="time-big">0:00.0</div>

  <div class="waveform-wrap">
    <div class="wave-loading" id="wave-loading">Analyzing audio…</div>
    <canvas id="waveform" style="display:none"></canvas>
  </div>

  <div class="times">
    <span id="cur-time">0:00.0</span>
    <span id="dur-time">0:00</span>
  </div>

  <div class="fine-wrap">
    <div class="fine-label">Fine tune (±2s)</div>
    <input type="range" id="fine-seek" min="-2" max="2" step="0.05" value="0" />
    <div class="fine-ends">
      <span id="fine-left">−2s</span>
      <span id="fine-right">+2s</span>
    </div>
  </div>

  <button class="play-btn" id="play-btn" onclick="togglePlay()">▶</button>

  <div class="status" id="status"></div>

  <button class="confirm-btn" id="confirm-btn" onclick="doConfirm()">✓ Confirm this position</button>

  <audio id="audio" preload="auto"></audio>

  <script>
    const tg       = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const params     = new URLSearchParams(location.search);
    const token      = params.get('token');
    const hintDur    = parseFloat(params.get('duration') || '0');
    const chatId     = params.get('chat_id');
    const userId     = params.get('user_id');
    const messageId  = params.get('message_id');

    const audio      = document.getElementById('audio');
    const timeBig    = document.getElementById('time-big');
    const curEl      = document.getElementById('cur-time');
    const durEl      = document.getElementById('dur-time');
    const playBtn    = document.getElementById('play-btn');
    const canvas     = document.getElementById('waveform');
    const waveLoad   = document.getElementById('wave-loading');
    const statusEl   = document.getElementById('status');
    const fineSeek   = document.getElementById('fine-seek');
    const fineLeft   = document.getElementById('fine-left');
    const fineRight  = document.getElementById('fine-right');
    const confirmBtn = document.getElementById('confirm-btn');
    const wctx       = canvas.getContext('2d');

    let peaks       = null;
    let duration    = hintDur || 0;
    let displayPos  = 0;   // authoritative position — always up to date regardless of iOS state
    let fineAnchor  = 0;

    // ── Helpers ──────────────────────────────────────────────────────────────

    function fmt(secs, dec) {
      const s = Math.max(0, secs), m = Math.floor(s / 60), r = s % 60;
      return dec ? `${m}:${r.toFixed(1).padStart(4,'0')}` : `${m}:${String(Math.floor(r)).padStart(2,'0')}`;
    }
    function setStatus(msg, err) {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (err ? ' error' : '');
    }
    function updateUI() {
      timeBig.textContent = fmt(displayPos, true);
      curEl.textContent   = fmt(displayPos, true);
    }

    // ── Waveform ─────────────────────────────────────────────────────────────

    function renderWaveform() {
      if (!peaks) return;
      const dpr = window.devicePixelRatio || 1;
      const W = canvas.clientWidth * dpr, H = canvas.clientHeight * dpr;
      if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
      const dur = duration || 1, playX = (displayPos / dur) * W;
      const barW = W / peaks.length;
      const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2ea6ff';
      wctx.clearRect(0, 0, W, H);
      peaks.forEach((p, i) => {
        const x = i * barW, barH = Math.max(3 * dpr, p * H * .85), y = (H - barH) / 2, gap = Math.max(1, barW * .2);
        wctx.fillStyle = x + barW <= playX ? accent : '#48484a';
        wctx.beginPath();
        wctx.roundRect ? wctx.roundRect(x+gap, y, barW-gap*2, barH, 2) : wctx.rect(x+gap, y, barW-gap*2, barH);
        wctx.fill();
      });
      wctx.fillStyle = '#fff';
      wctx.fillRect(Math.max(0, playX - dpr), 0, dpr * 2, H);
    }

    async function analyzeAudio() {
      try {
        const buf     = await (await fetch(`/audio/${token}`)).arrayBuffer();
        const actx    = new (window.AudioContext || window.webkitAudioContext)();
        const decoded = await actx.decodeAudioData(buf);
        if (!duration) duration = decoded.duration;
        durEl.textContent = fmt(duration);
        const raw = decoded.getChannelData(0), BARS = 150, block = Math.floor(raw.length / BARS);
        const rawP = Array.from({length: BARS}, (_, i) => {
          let max = 0, s = block * i;
          for (let j = 0; j < block; j++) { const v = Math.abs(raw[s+j]); if (v > max) max = v; }
          return max;
        });
        const maxP = Math.max(...rawP) || 1;
        peaks = rawP.map(p => p / maxP);
        waveLoad.style.display = 'none';
        canvas.style.display   = 'block';
        renderWaveform();
      } catch(e) {
        waveLoad.textContent = 'Waveform unavailable';
        console.error('Waveform:', e);
      }
    }

    // ── Seeking ───────────────────────────────────────────────────────────────

    function seekTo(time) {
      const c = Math.max(0, Math.min(time, duration || audio.duration || 0));
      displayPos = c;
      fineAnchor = c;
      audio.currentTime = c;           // attempt seek (may be lazy on iOS)
      fineSeek.value = 0;
      fineLeft.textContent  = fmt(Math.max(0, c - 2), true);
      fineRight.textContent = fmt(Math.min(duration || 9999, c + 2), true);
      updateUI(); renderWaveform();
    }

    fineSeek.addEventListener('input', () => {
      const t = Math.max(0, Math.min(fineAnchor + parseFloat(fineSeek.value), duration || audio.duration || 0));
      displayPos = t;
      audio.currentTime = t;
      updateUI(); renderWaveform();
    });

    // iOS seek fix: re-assert displayPos every time play starts so iOS can't drift
    audio.addEventListener('play', () => {
      audio.currentTime = displayPos;
      playBtn.textContent = '⏸';
    });
    audio.addEventListener('pause', () => { playBtn.textContent = '▶'; });
    audio.addEventListener('ended', () => { playBtn.textContent = '▶'; });
    // While playing, keep displayPos in sync with actual audio
    audio.addEventListener('timeupdate', () => {
      if (!audio.paused) { displayPos = audio.currentTime; }
      updateUI(); renderWaveform();
    });
    audio.addEventListener('loadedmetadata', () => { if (!duration) duration = audio.duration; durEl.textContent = fmt(duration); });
    audio.addEventListener('error', () => setStatus('Failed to load audio.', true));

    // Waveform seek via touch/mouse
    function seekFromX(cx) {
      const r = canvas.getBoundingClientRect();
      seekTo(Math.max(0, Math.min(1, (cx - r.left) / r.width)) * (duration || audio.duration || 0));
    }
    let waving = false;
    canvas.addEventListener('mousedown', e => { waving=true; seekFromX(e.clientX); });
    window.addEventListener('mousemove', e => { if(waving) seekFromX(e.clientX); });
    window.addEventListener('mouseup',   () => { waving=false; });
    canvas.addEventListener('touchstart', e => { e.preventDefault(); waving=true; seekFromX(e.touches[0].clientX); }, {passive:false});
    canvas.addEventListener('touchmove',  e => { e.preventDefault(); if(waving) seekFromX(e.touches[0].clientX); }, {passive:false});
    canvas.addEventListener('touchend',   () => { waving=false; });

    function togglePlay() {
      audio.paused ? audio.play().catch(e=>setStatus('Playback error: '+e.message,true)) : audio.pause();
    }

    // ── Confirm — POST to bot server, then close ──────────────────────────────

    async function doConfirm() {
      audio.pause();
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Sending…';

      const startSec = Math.round(displayPos * 100) / 100;

      try {
        const res = await fetch('/set-position', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            token,
            chat_id:    chatId,
            user_id:    userId,
            message_id: messageId,
            start_sec:  startSec,
          }),
        });
        if (!res.ok) throw new Error(`Server error ${res.status}`);
        tg.close();
      } catch(e) {
        setStatus('Failed to confirm — try again.', true);
        confirmBtn.disabled = false;
        confirmBtn.textContent = '✓ Confirm this position';
        console.error('Confirm error:', e);
      }
    }

    // ── Boot ──────────────────────────────────────────────────────────────────

    audio.src = `/audio/${token}`;
    if (hintDur > 0) { durEl.textContent = fmt(hintDur); fineLeft.textContent = '−2s'; fineRight.textContent = '+2s'; }
    analyzeAudio();
  </script>
</body>
</html>
